name: Veritabanı Yedekleme

on:
  schedule:
    # Her gün 03:00 UTC (06:00 TRT)
    - cron: "0 3 * * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Ubuntu runner'ının varsayılan postgresql-client paketi (16) production DB'nin
      # sürümünden (Neon, Postgres 18) daha eski — pg_dump kendinden yeni sürümdeki bir
      # sunucudan dump almayı reddediyor ("server version mismatch"). Resmi PGDG apt
      # deposundan sunucuyla aynı major sürümü (18) kuruyoruz.
      - name: pg_dump/pg_restore kur (PostgreSQL 18)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          # ubuntu-latest runner'ında /usr/bin/pg_dump zaten önceden kurulu (eski) bir
          # sürüme işaret ediyor ve update-alternatives bunu otomatik geçersiz kılmıyor
          # (bkz. ilk deneme: 18 kuruldu ama pg_dump hâlâ 16'ydı). 18'in bin dizinini
          # PATH'in başına ekleyerek doğru binary'nin çağrılmasını garantiliyoruz.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: pg_dump sürümünü doğrula
        run: pg_dump --version

      - name: Bağımlılıkları yükle
        run: npm ci --omit=dev --ignore-scripts

      - name: Yedek al ve Vercel Blob'a yükle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGDUMP_DATABASE_URL: ${{ secrets.PGDUMP_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node scripts/backup.mjs
