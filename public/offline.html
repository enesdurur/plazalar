<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bağlantı yok — Plazalar Teknik Hizmetler</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      main { text-align: center; padding: 24px; max-width: 360px; }
      h1 { font-size: 18px; margin: 0 0 8px; }
      p { font-size: 14px; color: #64748b; margin: 0 0 16px; }
      button {
        background: #0f172a;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>İnternet bağlantısı yok</h1>
      <p>Bu sayfayı görüntülemek için bağlantı gerekiyor. Bağlantı geri geldiğinde tekrar deneyin.</p>
      <button onclick="location.reload()">Tekrar dene</button>
    </main>
  </body>
</html>
